[package]
name = "oxifsshare"
description = "Offline browser for a document archive exported by a discontinued viewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["gui"]
# Build without the GUI (headless: CLI and --check only).
gui = ["dep:eframe", "dep:egui_extras", "dep:open"]

[dependencies]
oxifsshare-core = { path = "../oxifsshare-core" }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
egui_extras = { version = "=0.33.3", default-features = false, optional = true }
open = { version = "5.4", optional = true }
