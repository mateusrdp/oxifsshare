name: Release

# Runs on every push to main that changes code (and by hand). Builds three things:
#   1. a Debian sid build (inside a debian:sid container)
#   2. an AppImage (inside a debian:bookworm container, so it also runs on older systems)
#   3. a Windows portable zip (one statically linked .exe, no installer)
# then publishes a GitHub Release with SHA256SUMS.
#
# Tags: if the Cargo version has no release yet, this run creates the clean release
# v<version>. Every later push with the same version creates the pre-release
# v<version>-build.<run_number>. Tags created with GITHUB_TOKEN do not start new
# workflow runs, so the release cannot retrigger itself.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/dependabot.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# One release run at a time so build numbers stay orderly. Runs queue, never cancel.
concurrency:
  group: release
  cancel-in-progress: false

# Least privilege. Only the final job raises this.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  licenses:
    name: Third-party licence notices
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.3, pinned by commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install cargo-about and generate THIRD_PARTY_LICENSES.html
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install cargo-about --locked --version 0.9.2 --features cli
          cargo about generate --locked about.hbs > THIRD_PARTY_LICENSES.html
          test -s THIRD_PARTY_LICENSES.html
      # actions/upload-artifact v7.0.2, pinned by commit SHA.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: licenses
          path: THIRD_PARTY_LICENSES.html
          if-no-files-found: error

  linux-sid:
    name: Debian sid
    needs: licenses
    runs-on: ubuntu-latest
    container: debian:sid
    steps:
      - name: Install build tools (Debian packages)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential cargo rustc
          rustc --version
          cargo --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/download-artifact v8.0.2, pinned by commit SHA.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: licenses
      - name: Test
        run: cargo test --workspace --release --locked
      - name: Build
        run: cargo build --release --locked -p oxifsshare
      - name: Package
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          NAME="oxifsshare-${VERSION}-debian-sid-x86_64"
          mkdir -p "dist/${NAME}"
          cp target/release/oxifsshare README.md LICENSE THIRD_PARTY_LICENSES.html "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          rm -rf "dist/${NAME}"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist-linux-sid
          path: dist/*.tar.gz
          if-no-files-found: error

  appimage:
    name: AppImage
    needs: licenses
    runs-on: ubuntu-latest
    # Built on Debian 12 (glibc 2.36), so the AppImage runs on that and anything newer.
    container: debian:bookworm
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential file
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: licenses
      - name: Install Rust (rustup, stable, minimal profile)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          rustc --version
          cargo build --release --locked -p oxifsshare
      - name: Fetch AppImage tools (pinned versions, checksum-verified)
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl --proto '=https' --tlsv1.2 -sSfL -o runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          printf '%s  %s\n' \
            ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 appimagetool.AppImage \
            2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d runtime-x86_64 \
            > tools.sha256
          sha256sum -c tools.sha256
          chmod +x appimagetool.AppImage
      - name: Assemble AppDir and build the AppImage
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/doc/oxifsshare
          install -m755 target/release/oxifsshare AppDir/usr/bin/oxifsshare
          install -m644 packaging/oxifsshare.desktop AppDir/oxifsshare.desktop
          install -m644 packaging/oxifsshare.desktop AppDir/usr/share/applications/oxifsshare.desktop
          install -m644 packaging/oxifsshare.png AppDir/oxifsshare.png
          install -m644 packaging/oxifsshare.png AppDir/usr/share/icons/hicolor/256x256/apps/oxifsshare.png
          install -m644 LICENSE THIRD_PARTY_LICENSES.html AppDir/usr/share/doc/oxifsshare/
          ln -s usr/bin/oxifsshare AppDir/AppRun
          ln -s oxifsshare.png AppDir/.DirIcon
          mkdir -p dist
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run \
            --runtime-file runtime-x86_64 AppDir "dist/oxifsshare-${VERSION}-x86_64.AppImage"
      - name: Smoke test the AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./dist/oxifsshare-*-x86_64.AppImage --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows portable
    needs: licenses
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: licenses
      - name: Build (static C runtime, so no redistributable is needed)
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo build --release --locked -p oxifsshare
      - name: Package
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          NAME="oxifsshare-${VERSION}-windows-x86_64"
          mkdir -p "dist/${NAME}"
          cp target/release/oxifsshare.exe README.md LICENSE THIRD_PARTY_LICENSES.html "dist/${NAME}/"
          cd dist
          7z a -tzip "${NAME}.zip" "${NAME}" > /dev/null
          rm -rf "${NAME}"
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist-windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux-sid, appimage, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only job allowed to create tags and releases
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
            TITLE="oxifsshare ${VERSION} (build ${GITHUB_RUN_NUMBER})"
            KIND="--prerelease"
          else
            TAG="v${VERSION}"
            TITLE="oxifsshare ${VERSION}"
            KIND="--latest"
          fi
          echo "Publishing ${TAG}"
          gh release create "${TAG}" dist/* \
            --target "${GITHUB_SHA}" --title "${TITLE}" --generate-notes ${KIND}
      - name: Keep only the 15 newest build pre-releases
        run: |
          gh release list --limit 200 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-build\\.[0-9]+$")))] | .[15:] | .[].tagName' |
          while read -r tag; do
            echo "Deleting old build ${tag}"
            gh release delete "${tag}" --cleanup-tag --yes
          done
