[workspace]
resolver = "2"
members = ["crates/oxifsshare-core", "crates/oxifsshare"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV: see docs/CONTRIBUTING.md (milestone 4) and the "MSRV policy" section of README.md.
# 1.89 is the lowest toolchain this project verifies in CI and locally (quick-xml 0.42 itself needs 1.86).
# It will be raised in milestone 3 if the chosen GUI toolkit needs a newer compiler.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/mateusrdp/oxifsshare"
authors = ["The oxifsshare contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
