[workspace]
resolver = "2"
members = ["crates/oxifsshare-core", "crates/oxifsshare"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV: see docs/CONTRIBUTING.md (milestone 4) and the "MSRV policy" section of README.md.
# 1.95 is the lowest toolchain this project verifies in CI and locally (egui/eframe 0.37 require it).
# It is raised only when a dependency (currently the GUI toolkit) needs a newer compiler.
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/mateusrdp/oxifsshare"
authors = ["The oxifsshare contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
